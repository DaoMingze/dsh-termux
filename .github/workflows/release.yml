name: patchset

# Publishes the ONLY artifact this project ships: the patch set
# (dsh-termux-patchset.tar.gz — the updater's three scripts plus the patch
# files, ~40 KB). glibc, Node, npm and dsh itself are installed on the device
# from their own upstreams, so nothing else is built or uploaded here.
#
# Runs when the patch set actually changes, and by hand. No cron: there is
# nothing to poll — a release here only ever mirrors the checkout.
on:
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'scripts/patch-lib.sh'
      - 'build/build-patchset.sh'
      - '.github/workflows/release.yml'
  workflow_dispatch:

# Two publishers racing on the same tag/release would corrupt the asset.
concurrency:
  group: patchset-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    # No arm64 needed: this job packs a tarball and calls `gh`.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Pack the patch set
        id: pack
        run: |
          set -euo pipefail
          # The signature is computed from the same members the asset carries
          # (three scripts + patches/*.patch), so a device can compare it with
          # `dsh update --self --dry-run` and know whether it is behind.
          sig="$(bash -c 'source scripts/common.sh; dsh_patch_set_signature .')"
          bash build/build-patchset.sh -o dsh-termux-patchset.tar.gz
          tag="patches-$(date -u +%Y%m%d)-$(git rev-parse --short HEAD)"
          echo "signature=$sig" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "signature: $sig"
          echo "tag:       $tag"

      - name: Skip when this commit was already published
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.pack.outputs.tag }}" >/dev/null 2>&1; then
            echo "release ${{ steps.pack.outputs.tag }} already exists; nothing to do"
            echo "exists=1" >> "$GITHUB_OUTPUT"
          else
            echo "exists=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the asset
        if: steps.gate.outputs.exists == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.pack.outputs.tag }}
          SIG: ${{ steps.pack.outputs.signature }}
        run: |
          set -euo pipefail
          cat > notes.md <<EOF
          Patch set built from \`${GITHUB_SHA:0:7}\`.

          Identity is the content signature, not a version number:

          \`\`\`text
          ${SIG}
          \`\`\`

          Devices apply it with \`dsh update --self\` (downloads this asset, ~40 KB,
          compares signatures, applies only when different). \`dsh update --self
          --dry-run\` reports whether an update is available. No dsh/npm download is
          involved, and nothing else is published by this project.

          Installer and updater scripts are NOT part of this asset: they come from the
          repository checkout (\`bash scripts/00-setup.sh\`).
          EOF
          gh release create "$TAG" \
            --title "patch set ${TAG#patches-}" \
            --notes-file notes.md \
            dsh-termux-patchset.tar.gz
          echo "published $TAG with dsh-termux-patchset.tar.gz"
