# .pre-commit-config.yaml —— 由 aisa 依 project.json 的 langs 组装：通用文件卫生在前，各语言钩子在后。
# 种子文件：aisa 只在缺失时铺设，此后归项目所有（sync 不覆盖、check 不比字节）。
default_install_hook_types: [pre-commit]
default_stages: [pre-commit]
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/rvben/rumdl-pre-commit
    rev: v0.2.78
    hooks:
      # 同一范围单一工具：lint 与 format 都归 rumdl，不引 markdownlint/prettier
      - id: rumdl
        args: ["--fix"]
      - id: rumdl-fmt
